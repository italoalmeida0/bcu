name: Release & Build Matrix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            os: windows-latest
            arch: x64
          - target: arm64
            os: windows-latest
            arch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install uv & Dependencies
        run: |
          pip install uv
          uv pip install --system -e . pyinstaller typer

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --onefile --name bcu `
            --distpath dist/${{ matrix.target }} `
            --workpath build/${{ matrix.target }} `
            --collect-all textual `
            --collect-all mcp `
            --collect-all rich `
            --collect-all pydantic `
            --hidden-import bcu `
            --hidden-import bcu.cli `
            --hidden-import bcu.mcp_server `
            --hidden-import bcu.tui.app `
            --hidden-import bcu.security.auditor `
            --clean src/bcu/__main__.py

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver) { $ver = "0.1.0" }
          New-Item -ItemType Directory -Force -Path dist/portable
          Copy-Item dist/${{ matrix.target }}/bcu.exe dist/portable/
          Copy-Item README.md dist/portable/
          Copy-Item LICENSE dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath dist/bcu-v${ver}-windows-${{ matrix.target }}-portable.zip -Force
          Copy-Item dist/${{ matrix.target }}/bcu.exe dist/bcu-v${ver}-windows-${{ matrix.target }}.exe

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        if: matrix.target == 'x86_64'
        with:
          path: installer/bcu_setup.iss

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bcu-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.exe
            dist-release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
