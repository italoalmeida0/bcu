[project]
name = "bcu"
version = "0.1.0"
description = "Bulk Crap Uninstaller (BCU) - Python CLI & AI Agent Port"
readme = "README.md"
authors = [
    { name = "Italo Almeida" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.1",
    "pydantic>=2.7.0",
    "psutil>=5.9.8",
    "mcp>=1.2.0,<2",
    "textual>=0.70.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bcu = "bcu.cli:main"
bcu-cli = "bcu.cli:main"
bcu-mcp = "bcu.mcp_server:main"
bcu-tui = "bcu.tui.app:main"
bcu-gui = "bcu.tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as asyncio test",
]
addopts = "-v --strict-markers"
